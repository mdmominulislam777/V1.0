<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="scotBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005eb8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#030712" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Scottish St. Andrew's Cross Flag subtle background -->
  <g opacity="0.25">
    <line x1="20" y1="20" x2="180" y2="180" stroke="#005eb8" stroke-width="24"/>
    <line x1="180" y1="20" x2="20" y2="180" stroke="#005eb8" stroke-width="24"/>
  </g>
  <!-- Scottish Claymore Sword -->
  <g transform="translate(85, 30)">
    <!-- Blade Tip -->
    <path d="M15 10 L25 10 L20 0 Z" fill="#ffffff"/>
    <!-- Blade Body -->
    <rect x="15" y="10" width="10" height="75" fill="url(#bladeGrad)"/>
    <line x1="20" y1="10" x2="20" y2="85" stroke="#475569" stroke-width="1.5"/>
    <!-- Crossguard -->
    <rect x="-5" y="85" width="50" height="8" rx="3" fill="#0284c7"/>
    <!-- Hilt & Pommel -->
    <rect x="17" y="93" width="6" height="18" fill="#1e293b"/>
    <circle cx="20" cy="115" r="6" fill="#0284c7"/>
  </g>
  <!-- Name Banner -->
  <rect x="15" y="152" width="170" height="26" rx="6" fill="url(#scotBlue)"/>
  <text x="100" y="169" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.5" text-anchor="middle">DREW MCINTYRE</text>
</svg>
