name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Releases? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Production Release APK (Mobile & TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read App Version from version.json
        id: get_version
        run: |
          VERSION_NAME=$(node -e "const v=require('./version.json'); console.log(v.versionName || v.version || '1.0.0');")
          VERSION_CODE=$(node -e "const v=require('./version.json'); console.log(v.versionCode || 1);")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo " HIGHFY TV PRODUCTION BUILD TARGET"
          echo " Application ID : com.highfy.tv"
          echo " Version Name   : $VERSION_NAME"
          echo " Version Code   : $VERSION_CODE"
          echo " Java Version   : 17 (Temurin)"
          echo " Android SDK    : 34"
          echo " Target Build   : Release APK (Signed)"
          echo "=========================================="

      - name: Install Dependencies & Build Web Assets
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Installing dependencies using npm ci..."
            npm ci
          else
            echo "Installing dependencies using npm install..."
            npm install
          fi
          echo "Building production web assets..."
          npm run build
          echo "Synchronizing assets to Android assets folder..."
          npm run sync:android
          echo "Verifying synchronized Android assets:"
          ls -la android/app/src/main/assets/

      - name: Configure Production Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::CRITICAL PRODUCTION SIGNING CONFIGURATION MISSING!"
            echo "::error::The following required GitHub Secrets must be set in Repository Settings -> Secrets and variables -> Actions:"
            echo "::error::  1. KEYSTORE_BASE64   (Base64 encoded production .jks/.keystore)"
            echo "::error::  2. KEYSTORE_PASSWORD (Keystore store password)"
            echo "::error::  3. KEY_ALIAS         (Keystore key alias)"
            echo "::error::  4. KEY_PASSWORD      (Keystore key password)"
            echo "::error::Halting build to prevent producing unsigned, unauthenticated, or mismatched release APKs."
            exit 1
          fi

          echo "Configuring Official Production Keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          
          if [ ! -s "android/keystore/release.jks" ]; then
            echo "::error::Decoded production keystore file is empty or corrupted! Check KEYSTORE_BASE64 secret formatting."
            exit 1
          fi

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/keystore/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "SIGNING_MODE=OFFICIAL_PRODUCTION_SECRETS" >> $GITHUB_ENV

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          echo "Inspecting dependency resolution tree for Kotlin stdlib..."
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep -i "kotlin-stdlib" || true
          echo "Executing Gradle Release Build..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and Package Release APK
        run: |
          mkdir -p output_apk
          APK_SOURCE=$(find android/app/build/outputs/apk/release -name "*release*.apk" | head -n 1)

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Release APK was not generated in android/app/build/outputs/apk/release!"
            ls -laR android/app/build/outputs/ || true
            exit 1
          fi

          FINAL_APK_NAME="highfy-tv-v${{ env.VERSION_NAME }}-release.apk"
          cp "$APK_SOURCE" "output_apk/$FINAL_APK_NAME"

          echo "=========================================="
          echo " RELEASE APK VERIFICATION PASSED"
          echo " Filename : output_apk/$FINAL_APK_NAME"
          echo " Size     : $(ls -lh "output_apk/$FINAL_APK_NAME" | awk '{print $5}')"
          echo " Signing  : ${{ env.SIGNING_MODE }}"
          echo " SHA256   : $(sha256sum "output_apk/$FINAL_APK_NAME" | awk '{print $1}')"
          echo "=========================================="

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: highfy-tv-v${{ env.VERSION_NAME }}-release-apk
          path: output_apk/highfy-tv-v${{ env.VERSION_NAME }}-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/highfy-tv-v${{ env.VERSION_NAME }}-release.apk
          name: HighFy TV v${{ env.VERSION_NAME }} (Production Release)
          tag_name: ${{ github.ref_name }}
          body: |
            ## HighFy TV Official Production Release v${{ env.VERSION_NAME }}
            
            - **Application ID**: `com.highfy.tv`
            - **Version Code**: `${{ env.VERSION_CODE }}`
            - **Version Name**: `${{ env.VERSION_NAME }}`
            - **Target Platforms**: Universal Android (Mobile Phones, Tablets & Android TV / Google TV)
            - **Remote / D-Pad Support**: Complete 5-way D-Pad navigation for Smart TV
            - **Streaming Engine**: HLS.js + mpegts.js Multi-Server Live Streaming Engine
            - **Build Type**: Production Signed Release APK
          draft: false
          prerelease: false
