  <path d="M 50 14 C 70 14, 80 21, 80 37 C 80 61, 59 78, 50 85 C 41 78, 20 61, 20 37 C 20 21, 30 14, 50 14 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.1" 
        stroke-width="1.5"/>
  <!-- Central Sports Star / Emblem -->
  <path d="M 50 32 L 53.5 42.5 L 64.5 42.5 L 55.5 49 L 59 59.5 L 50 53 L 41 59.5 L 44.5 49 L 35.5 42.5 L 46.5 42.5 Z" 
        fill="#38bdf8" 
        opacity="0.9"/>
  <!-- Lower Crest Accent Bars -->
  <path d="M 38 66 Q 50 72 62 66" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <path d="M 42 72 Q 50 77 58 72" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
</svg>
