<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="wweMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e4e4e7"/>
      <stop offset="70%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="redSlash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Base Disc -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Iconic Modern WWE 'W' Logo -->
  <g filter="url(#glow)">
    <!-- Left W Wing -->
    <path d="M42 56 L62 136 L78 136 L66 82 L84 136 L100 136 L82 56 Z" fill="url(#wweMetal)"/>
    <!-- Right Inverted W Wing (Mirrored Iconic Shape) -->
    <path d="M158 56 L138 136 L122 136 L134 82 L116 136 L100 136 L118 56 Z" fill="url(#wweMetal)"/>
    <!-- Central Signature Red Swoosh / Scratch Underline -->
    <path d="M36 128 L164 128 L152 144 L48 144 Z" fill="url(#redSlash)"/>
  </g>
  <!-- Text Label -->
  <text x="100" y="174" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">WWE</text>
</svg>
